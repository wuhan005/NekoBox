name: Docker
on:
  push:
    tags:
      - '**'

jobs:
  build:
    if: github.event.deleted == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ghcr.io/wuhan005/nekobox
            context: .
          - image: ghcr.io/wuhan005/nekobox-web
            context: ./web
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Resolve release tag and commit
        id: release
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo "::error::The Git tag must also be a valid Docker image tag."
            exit 1
          fi
          commit=$(git rev-parse --verify 'HEAD^{commit}')
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          build-args: |
            GITHUB_SHA=${{ steps.release.outputs.commit }}
          tags: ${{ matrix.image }}:${{ github.ref_name }}
